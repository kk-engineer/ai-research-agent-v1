[project]
name = "ai-research-agent"
version = "0.1.0"
description = "Async AI/ML research agent with local LLM synthesis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "arxiv>=2.1",
    "semanticscholar>=0.8",
    "wikipedia-api>=0.7",
    "ddgs",
    "feedparser>=6.0",
    "trafilatura>=1.9",
    "readability-lxml>=0.8",
    "markdownify>=0.12",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "llama-cpp-python>=0.2.77",
    "openai>=1.30",
    "tiktoken>=0.7",
    "aiosqlite>=0.20",
    "diskcache>=5.6",
    "rich>=13.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[project.scripts]
agent = "agent.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]
